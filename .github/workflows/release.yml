name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish. Required when running from a branch."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux binaries
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "::error::Run this workflow from a tag or provide the tag input."
            exit 1
          fi

          git fetch --force --tags

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag '${tag}' does not exist."
            exit 1
          fi

          git checkout --detach "refs/tags/${tag}"

          version="${tag}"
          asset_version="${version//[^A-Za-z0-9._-]/-}"

          {
            echo "tag=${tag}"
            echo "version=${asset_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release assets
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          build() {
            local goarch="$1"
            local suffix="$2"
            local goarm="${3:-}"
            local name="iptfwd_${VERSION}_linux_${suffix}"
            local workdir="dist/${name}"
            local binary="${workdir}/iptfwd"

            mkdir -p "${workdir}"

            local -a env_vars=(
              CGO_ENABLED=0
              GOOS=linux
              GOARCH="${goarch}"
            )

            if [[ -n "${goarm}" ]]; then
              env_vars+=(GOARM="${goarm}")
            fi

            env "${env_vars[@]}" go build \
              -trimpath \
              -ldflags "-s -w" \
              -o "${binary}" \
              ./main.go

            cp README.md LICENSE "${workdir}/"
            tar -C dist -czf "${workdir}.tar.gz" "${name}"
            rm -rf "${workdir}"
          }

          build 386 386
          build amd64 amd64
          build arm armv6 6
          build arm armv7 7
          build arm64 arm64

          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --generate-notes
          fi
